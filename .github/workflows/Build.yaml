name: Build FluidCAD APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Fluid-CAD/FluidCAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Deps
        run: |
          npm ci
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Build Website
        run: |
          npm run build
          ls website/build

      - name: Init Capacitor
        run: |
          npx cap init FluidCAD io.fluidcad.offline --web-dir=website/build
          npx cap add android
          npx cap copy android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fluidcad-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
